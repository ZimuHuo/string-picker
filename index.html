<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>String Picker</title><style>body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#111;color:#fff;margin:0;padding:20px}main{max-width:720px;margin:auto}.card{background:#1b1b1f;border-radius:16px;padding:16px;margin:12px 0}label{display:block;color:#aaa;font-size:13px;margin-bottom:6px}select,input,button{font-size:17px;border-radius:12px;padding:12px}select,input{width:100%;box-sizing:border-box;background:#111;color:#fff;border:1px solid #333}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.grid{grid-template-columns:1fr}}button{border:0;background:#0a84ff;color:white;font-weight:700;margin-right:8px}.secondary{background:#333}.danger{background:#6b211e}.prompt{font-size:64px;font-weight:800;text-align:center;min-height:110px;display:flex;align-items:center;justify-content:center}.status,.heard{text-align:center;color:#aaa;min-height:24px}.ok{color:#30d158}.bad{color:#ff453a}.progress{height:10px;background:#111;border-radius:99px;overflow:hidden;margin-top:12px}.progress div{height:100%;width:0;background:#0a84ff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}.stat{background:#111;border-radius:12px;padding:10px}.stat b{display:block;font-size:24px}.small{color:#aaa;font-size:13px;line-height:1.5}</style></head><body><main><h1>String Picker</h1><p>Practice finding guitar strings without looking.</p><div class="card"><div class="grid"><div><label>Strings per prompt</label><select id="groupSize"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select></div><div><label>Gap after prompt (seconds)</label><input id="spacing" type="number" min="1" max="30" step="0.5" value="5"></div><div><label>Voice speed</label><select id="voiceRate"><option value="0.62">Very slow</option><option value="0.78" selected>Slow</option><option value="0.95">Normal</option></select></div><div><label>Advance</label><select id="mode"><option value="correct" selected>After correct pattern</option><option value="timer">After timer</option></select></div></div></div><div class="card"><div id="prompt" class="prompt">—</div><div id="status" class="status">Tap Start and allow microphone access.</div><div id="heard" class="heard">Heard: —</div><div class="progress"><div id="bar"></div></div></div><div class="card"><button id="startBtn">Start</button><button id="repeatBtn" class="secondary" disabled>Repeat</button><button id="nextBtn" class="secondary" disabled>Next</button><button id="stopBtn" class="danger" disabled>Stop</button></div><div class="card stats"><div class="stat"><b id="correct">0</b><span>correct</span></div><div class="stat"><b id="mistakes">0</b><span>mistakes</span></div><div class="stat"><b id="accuracy">—</b><span>accuracy</span></div></div><div class="card small">Standard tuning: 6=E, 5=A, 4=D, 3=G, 2=B, 1=high E. Play open strings one at a time.</div></main><script>(()=>{const $=id=>document.getElementById(id);const hz={1:329.63,2:246.94,3:196,4:146.83,5:110,6:82.41};let stream,audioCtx,analyser,src,raf,running=false,current=[],idx=0,nextTimer=null,correct=0,mistakes=0,speechGuardUntil=0,stableCandidate=null,stableSince=0,lastAccepted=0,lastWrong=0;const groupSize=$("groupSize"),spacing=$("spacing"),voiceRate=$("voiceRate"),mode=$("mode"),promptEl=$("prompt"),statusEl=$("status"),heardEl=$("heard"),bar=$("bar"),startBtn=$("startBtn"),repeatBtn=$("repeatBtn"),nextBtn=$("nextBtn"),stopBtn=$("stopBtn"),correctEl=$("correct"),mistakesEl=$("mistakes"),accuracyEl=$("accuracy");function stats(){correctEl.textContent=correct;mistakesEl.textContent=mistakes;const t=correct+mistakes;accuracyEl.textContent=t?Math.round(correct/t*100)+"%":"—"}function rand(n){const a=[];for(let i=0;i<n;i++){let v;do{v=1+Math.floor(Math.random()*6)}while(i&&v===a[i-1]);a.push(v)}return a}function speak(p){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(p.join(", "));u.rate=parseFloat(voiceRate.value);u.onstart=()=>speechGuardUntil=performance.now()+600;u.onend=()=>{speechGuardUntil=performance.now()+500;if(mode.value==="timer")armTimer()};speechSynthesis.speak(u)}function show(p){clearTimeout(nextTimer);current=p;idx=0;promptEl.textContent=p.join("   ");statusEl.className="status";statusEl.textContent="Listen, then play.";heardEl.textContent="Heard: —";bar.style.width="0%";speak(p)}function armTimer(){const ms=Math.max(1000,(parseFloat(spacing.value)||5)*1000);nextTimer=setTimeout(nextPrompt,ms)}function nextPrompt(){if(running)show(rand(parseInt(groupSize.value)))}function cents(f,t){return 1200*Math.log2(f/t)}function nearest(f){let bs=null,bc=1e9;for(const s of [6,5,4,3,2,1]){const c=Math.abs(cents(f,hz[s]));if(c<bc){bc=c;bs=s}}return{s:bs,c:bc}}function pitch(buf,sr){let rms=0;for(let i=0;i<buf.length;i++)rms+=buf[i]*buf[i];rms=Math.sqrt(rms/buf.length);if(rms<0.012)return-1;const minLag=Math.floor(sr/360),maxLag=Math.min(Math.floor(sr/72),buf.length-3);let bestLag=-1,best=0;for(let lag=minLag;lag<=maxLag;lag++){let cross=0,e1=0,e2=0;for(let i=0;i<buf.length-lag;i+=2){const a=buf[i],b=buf[i+lag];cross+=a*b;e1+=a*a;e2+=b*b}const corr=cross/Math.sqrt((e1*e2)||1);if(corr>best){best=corr;bestLag=lag}}if(bestLag<0||best<0.72)return-1;return sr/bestLag}function accept(s){const now=performance.now();if(now<speechGuardUntil||now-lastAccepted<360)return;if(stableCandidate!==s){stableCandidate=s;stableSince=now;return}if(now-stableSince<120)return;heardEl.textContent="Heard: "+s;const expected=current[idx];if(s===expected){lastAccepted=now;stableCandidate=null;idx++;bar.style.width=(idx/current.length*100)+"%";statusEl.className="status ok";statusEl.textContent="Good — string "+s;if(idx>=current.length){correct++;stats();statusEl.textContent="Correct ✓";if(mode.value==="correct")armTimer()}}else if(now-lastWrong>850){lastWrong=now;mistakes++;stats();statusEl.className="status bad";statusEl.textContent="Heard "+s+" — expected "+expected}}function loop(){if(!running||!analyser)return;const buf=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(buf);const f=pitch(buf,audioCtx.sampleRate);if(f>0){const n=nearest(f);if(n.c<65)accept(n.s)}raf=requestAnimationFrame(loop)}async function start(){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});src=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=4096;src.connect(analyser);running=true;startBtn.disabled=true;repeatBtn.disabled=false;nextBtn.disabled=false;stopBtn.disabled=false;nextPrompt();loop()}catch(e){console.error(e);statusEl.className="status bad";statusEl.textContent="Couldn't access microphone. Check browser microphone permission and make sure this page is served over HTTPS."}}function stop(){running=false;clearTimeout(nextTimer);if(raf)cancelAnimationFrame(raf);speechSynthesis.cancel();if(stream)stream.getTracks().forEach(t=>t.stop());if(audioCtx)audioCtx.close();startBtn.disabled=false;repeatBtn.disabled=true;nextBtn.disabled=true;stopBtn.disabled=true;statusEl.className="status";statusEl.textContent="Stopped."}startBtn.onclick=start;repeatBtn.onclick=()=>running&&show(current);nextBtn.onclick=nextPrompt;stopBtn.onclick=stop})();</script></body></html>
